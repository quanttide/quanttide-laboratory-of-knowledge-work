name: 三类判据
description: 试三种判据：rule 当场判、agent 照判准审、human 留给人
steps:
- name: 写一句
  executor: agent
  criteria:
  - path: examples/default/data/artifacts/report/话.md
    description: 话落在
    executor: rule
  - description: 内容是中文且只有一行
    executor: agent
  - description: 创始人认可
    executor: human
  description: 在 examples/default/data/artifacts/report/话.md 里写一行中文（就一行）
