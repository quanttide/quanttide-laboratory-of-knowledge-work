name: 课程档案比对
description: 步骤串联：写清每步做什么、怎么算完。
steps:
- name: 定位
  what: 定位
  executor: agent
  criteria:
  - type: rule
    note: 个人课程档案在
    path: data/profile/iGuo/course/index.md
  - type: rule
    note: 课程研发档案在
    path: /home/iguo/repos/quanttide/domains/quanttide-course/data/profile/README.md
- name: 比对
  what: 比对
  executor: agent
  criteria:
  - type: rule
    note: 产物落成
    path: examples/default/data/artifacts/课程档案比对/比对.md
  - type: rule
    note: 产物点到两边的课
    file: examples/default/data/artifacts/课程档案比对/比对.md
    contains: production-internship
  - type: rule
    note: 产物给了两侧缺口
    file: examples/default/data/artifacts/课程档案比对/比对.md
    contains: 缺口
- name: 结论
  what: 结论
  executor: agent
  criteria:
  - type: rule
    note: 结论写进产物
    file: examples/default/data/artifacts/课程档案比对/比对.md
    contains: '## 结论'
  - type: human
    note: 创始人点头（回流与并法怎么定）
