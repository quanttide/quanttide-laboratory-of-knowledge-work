name: 课程档案比对
description: 步骤串联：写清每步做什么、怎么算完。
steps:
- name: 定位
  executor: agent
  criteria:
  - type: rule
    path: data/profile/iGuo/course/index.md
    description: 个人课程档案在
  - type: rule
    path: /home/iguo/repos/quanttide/domains/quanttide-course/data/profile/README.md
    description: 课程研发档案在
  description: 定位
- name: 比对
  executor: agent
  criteria:
  - type: rule
    path: examples/default/data/artifacts/课程档案比对/比对.md
    description: 产物落成
  - type: rule
    file: examples/default/data/artifacts/课程档案比对/比对.md
    contains: production-internship
    description: 产物点到两边的课
  - type: rule
    file: examples/default/data/artifacts/课程档案比对/比对.md
    contains: 缺口
    description: 产物给了两侧缺口
  description: 比对
- name: 结论
  executor: agent
  criteria:
  - type: rule
    file: examples/default/data/artifacts/课程档案比对/比对.md
    contains: '## 结论'
    description: 结论写进产物
  - type: human
    description: 创始人点头（回流与并法怎么定）
  description: 结论
